name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          GEMINI_API_KEY: ci-placeholder-no-api-requests
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/khaddaachristy/christy-khaddaa-githubactions:latest .

      - name: Push Docker image
        run: docker push ghcr.io/khaddaachristy/christy-khaddaa-githubactions:latest

  deploy:
    needs: test
    runs-on: [self-hosted, Linux, portfolio-deploy]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check Docker on Linux
        shell: bash
        run: docker info

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on Linux
        shell: bash
        run: docker pull --platform linux/amd64 ghcr.io/khaddaachristy/christy-khaddaa-githubactions:latest

      - name: Deploy on Linux
        shell: bash
        run: |
          test -f "$HOME/ai-agent.env" || { echo "Create $HOME/ai-agent.env with GEMINI_API_KEY before deploying."; exit 1; }
          existing=$(docker ps -aq --filter "name=^/portfolio-app$")
          if [ -n "$existing" ]; then
            docker rm -f portfolio-app
          fi
          docker run -d --platform linux/amd64 --name portfolio-app -p 127.0.0.1:8000:8000 --env-file "$HOME/ai-agent.env" ghcr.io/khaddaachristy/christy-khaddaa-githubactions:latest
